<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="The page you are looking for could not be found. Return to ThreadMark or explore our custom embroidery and monogramming services."
    />

    <meta name="theme-color" content="#00365c" />

    <title>ThreadMark | Page Not Found</title>

    <link rel="icon" type="image/png" href="./images/logo.png" />

    <link rel="apple-touch-icon" href="./images/logo.png" />

    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="404.css" />
  </head>

  <body data-root="../">
    <div class="error-controls">
      <button
        class="error-control-btn"
        id="rtlToggle"
        type="button"
        title="RTL Mode"
        aria-label="Toggle RTL mode"
      >
        <i data-lucide="arrow-left-right"></i>
      </button>

      <button
        class="error-control-btn"
        id="darkToggle"
        type="button"
        title="Dark Mode"
        aria-label="Toggle dark mode"
      >
        <i data-lucide="moon"></i>
      </button>
    </div>

    <main class="error-page">
      <span class="error-page__decoration error-page__decoration--one"></span>

      <span class="error-page__decoration error-page__decoration--two"></span>

      <div class="error-page__container">
        <div class="error-page__visual" aria-hidden="true">
          <span class="error-page__thread error-page__thread--one"></span>

          <span class="error-page__thread error-page__thread--two"></span>

          <div class="error-page__number">
            <span>4</span>

            <div class="error-page__zero">
              <div class="error-page__zero-inner">
                <i data-lucide="scissors"></i>
              </div>
            </div>

            <span>4</span>
          </div>

          <div class="error-page__stitch">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="error-page__content">
          <span class="section-tag">
            <span class="section-tag__dot"></span>
            Page Not Found
          </span>

          <h1 class="error-page__title">
            This Thread Seems to Have
            <span>Gone Missing.</span>
          </h1>

          <p class="error-page__description">
            The page you were looking for may have been moved, renamed, or
            carefully tucked away somewhere else. Let’s help you find your way
            back to ThreadMark.
          </p>

          <div class="error-page__actions">
            <a href="index.html" class="btn-primary">
              <i data-lucide="house"></i>
              <span>Back to Home</span>
            </a>

            <a href="products.html" class="btn-secondary">
              <span>Explore Products</span>
              <i data-lucide="arrow-up-right"></i>
            </a>
          </div>

          <div class="error-page__help">
            <span class="error-page__help-icon">
              <i data-lucide="message-circle"></i>
            </span>

            <div>
              <span>Still need help?</span>

              <a href="contact.html">
                Contact our team
                <i data-lucide="arrow-right"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@0.542.0/dist/umd/lucide.min.js"></script>
    <script src="./main/main.js"></script>
  </body>
</html>
